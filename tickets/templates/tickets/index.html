<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>IT-қолдау өтінімдері</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 750px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .errorlist { color: red; }
    </style>
</head>
<body>
    <h2>Жаңа өтінім жіберу</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Жіберу</button>
    </form>

    <h2>Өтінімдер тізімі</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Тақырып</th>
                <th>Сипаттама</th>
                <th>Басымдық</th>
                <th>Мәртебе</th>
            </tr>
        </thead>
        <tbody>
            {% for t in tickets %}
            <tr>
                <td>{{ t.id }}</td>
                <td>{{ t.title }}</td>
                <td>{{ t.description }}</td>
                <td>{{ t.priority }}</td>
                <td><b>{{ t.status }}</b></td>
            </tr>
            {% empty %}
            <tr><td colspan="5">Әзірге өтінімдер жоқ.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
